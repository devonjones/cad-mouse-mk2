; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test
default_envs = firmware

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040
framework = arduino

board_build.core = earlephilhower
; Present as a 3Dconnexion SpaceMouse Compact so 3DxWare/spacenavd bind to it.
; If your real 3Dconnexion device is also a Compact and the driver gets
; confused, switch usb_pid to 0xC62E (SpaceMouse Wireless, cabled).
board_build.arduino.earlephilhower.usb_vid = 0x256F
board_build.arduino.earlephilhower.usb_pid = 0xC635
board_build.arduino.earlephilhower.usb_manufacturer = 3Dconnexion
board_build.arduino.earlephilhower.usb_product = SpaceMouse Compact

lib_deps =
	infineon/XENSIV 3D Magnetic Sensor TLx493D@^1.1.0
	bxparks/AceButton@^1.10.1
	adafruit/Adafruit NeoPixel@^1.12.3

build_src_filter = +<*> -<diag_main.cpp>

; One unit-agnostic firmware; per-unit calibration is deployed as a
; config UF2 built from configs/<unit>.json (tools/config/README.md).
[env:firmware]
build_flags =
	-DUSE_TINYUSB

; Hardware diagnostic (serial-only, probes sensors + load switches).
[env:diag]
build_flags =
	-DUSE_TINYUSB
build_src_filter = +<diag_main.cpp>

; Same firmware under a product ID 3Dconnexion's Windows driver doesn't
; claim. With 0xC635 that driver throttles our reports (unit 1, 2026-11-17:
; translation updates every 7 ms typical / 31 ms p90, vs 3 / 7 ms here), and
; this build felt best. 0xC6F0 is unassigned as far as we know, but it sits
; in 3Dconnexion's vendor ID space.
[env:firmware-generic]
build_flags =
	-DUSE_TINYUSB
board_build.arduino.earlephilhower.usb_pid = 0xC6F0
