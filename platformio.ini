; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test
default_envs = firmware

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040
framework = arduino

board_build.core = earlephilhower
; Default USB ID 256F:C6F0, which 3Dconnexion's Windows driver doesn't
; claim. Under the real Compact ID (0xC635, see env:firmware-compact) that
; driver throttles our reports and layers its Compact profile on top:
; unit 1, 2026-11-17, translation updates every 7 ms typical / 31 ms p90
; vs 3 / 7 ms here, and it felt much worse. 0xC6F0 is unassigned as far as
; we know, but it sits in 3Dconnexion's vendor ID space.
board_build.arduino.earlephilhower.usb_vid = 0x256F
board_build.arduino.earlephilhower.usb_pid = 0xC6F0
board_build.arduino.earlephilhower.usb_manufacturer = 3Dconnexion
board_build.arduino.earlephilhower.usb_product = SpaceMouse Compact

lib_deps =
	infineon/XENSIV 3D Magnetic Sensor TLx493D@^1.1.0
	bxparks/AceButton@^1.10.1
	adafruit/Adafruit NeoPixel@^1.12.3

build_src_filter = +<*> -<diag_main.cpp>

; One unit-agnostic firmware; per-unit calibration is deployed as a
; config UF2 built from configs/<unit>.json (tools/config/README.md).
[env:firmware]
build_flags =
	-DUSE_TINYUSB

; Hardware diagnostic (serial-only, probes sensors + load switches).
[env:diag]
build_flags =
	-DUSE_TINYUSB
build_src_filter = +<diag_main.cpp>

; Opt-in SpaceMouse Compact identity, for 3DxWare's Compact profile or
; spacenavd, which bind by VID/PID.
[env:firmware-compact]
build_flags =
	-DUSE_TINYUSB
board_build.arduino.earlephilhower.usb_pid = 0xC635
